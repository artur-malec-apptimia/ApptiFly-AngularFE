<section class="panel" [class.is-hidden]="!isVisible()">
  <div class="panel-topbar">
    <button
      class="panel-header"
      type="button"
      (click)="toggle()"
      [attr.aria-expanded]="isVisible()"
      [attr.aria-label]="isVisible() ? 'Collapse aircraft panel' : 'Expand aircraft panel'"
    >
      <span>Aircraft</span>

      <img
        class="panel-toggle-icon"
        [class.is-collapsed]="!isVisible()"
        src="icons/Chevron.png"
        alt=""
      />
    </button>
  </div>

  <div class="panel-content">
    <div class="panel-content">
      <div class="aircraft-actions" aria-label="Aircraft actions">
        <button type="button" (click)="rightPanelOpen.emit()">Aircraft 1</button>
        <button type="button" (click)="rightPanelOpen.emit()">Aircraft 2</button>
      </div>
    </div>
  </div>
</section>
