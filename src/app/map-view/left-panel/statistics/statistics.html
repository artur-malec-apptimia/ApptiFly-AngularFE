<section class="panel-section" [class.is-expanded]="isExpanded()">
  <button
    class="section-header"
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="isExpanded()"
    aria-controls="statistics-content"
  >
    <img class="section-icon" src="icons/StatsIcon.png" alt="" />
    <span class="section-title">Statistics</span>
    <img
      class="section-chevron"
      [class.is-expanded]="isExpanded()"
      src="icons/Chevron.png"
      alt=""
    />
  </button>

  <div class="section-expandable">
    <div id="statistics-content" class="section-content">
      <div class="statistics-list">
        <div class="stat-row stat-row-primary">
          <span>Currently on air</span>
          <strong>{{ currentlyOnAir() }}</strong>
        </div>

        <div class="statistics-separator"></div>

        <div class="stat-row">
          <span>Spotted Today</span>
          <strong>{{ spottedToday() }}</strong>
        </div>

        <div class="stat-row">
          <span>Tracked This Week</span>
          <strong>{{ trackedThisWeek() }}</strong>
        </div>

        <div class="stat-row">
          <span>Tracked (30 days)</span>
          <strong>{{ trackedLastThirtyDays() }}</strong>
        </div>

        <button class="show-more-button" type="button">Show more</button>
      </div>
    </div>
  </div>
</section>
