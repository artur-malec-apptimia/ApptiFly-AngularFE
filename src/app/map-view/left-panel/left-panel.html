<div class="left-panel-dock" [class.is-hidden]="!isVisible()">
  <section class="panel" aria-label="Left panel"></section>

  <button
    class="left-panel-toggle"
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="isVisible()"
    [attr.aria-label]="isVisible() ? 'Collapse panel' : 'Expand panel'"
    [attr.title]="isVisible() ? 'Collapse panel' : 'Expand panel'"
  >
    <span class="toggle-icon">
      @if (isVisible()) {
        ‹
      } @else {
        ›
      }
    </span>
  </button>
</div>
