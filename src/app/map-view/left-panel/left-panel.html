<div class="left-panel-dock" [class.is-hidden]="!isVisible()">
  <section class="panel" aria-label="Left panel">
    <div class="panel-brand">
      <h1 class="panel-title"><span class="panel-title-accent">Appti</span>Fly</h1>

      <div class="panel-logo-line">
        <span>by</span>

        <a
          class="brand-link"
          href="https://www.apptimia.com"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visit Apptimia website"
        >
          <img class="brand-logo" src="icons/apptimiaLogo.png" alt="Apptimia" />
        </a>
      </div>
    </div>
    <div class="panel-separator"></div>
    <app-filters></app-filters>
    <app-statistics></app-statistics>
    <app-settings></app-settings>
  </section>

  <button
    class="left-panel-toggle"
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="isVisible()"
    [attr.aria-label]="isVisible() ? 'Collapse panel' : 'Expand panel'"
    [attr.title]="isVisible() ? 'Collapse panel' : 'Expand panel'"
  >
    <span class="toggle-icon">
      @if (isVisible()) {
        ‹
      } @else {
        ›
      }
    </span>
  </button>
</div>
