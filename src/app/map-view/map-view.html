<div class="map-shell" #mapShell>
  <div id="map"></div>

  <div class="map-actions">
    <button class="map-action icon-button" type="button" (click)="zoomIn()" aria-label="Zoom in">
      +
    </button>
    <output class="zoom-percent" aria-label="Current zoom"> {{ zoomPercent() }}% </output>
    <button class="map-action icon-button" type="button" (click)="zoomOut()" aria-label="Zoom out">
      −
    </button>
    <button
      class="map-action icon-button"
      type="button"
      (click)="centerOnReceiver()"
      aria-label="Receiver"
    >
      <img src="icons/ReceiverIcon.png" alt="" />
    </button>
    <button
      class="map-action icon-button"
      type="button"
      (click)="locateMe()"
      aria-label="Use my location"
    >
      <img src="icons/LocationIcon.png" alt="" />
    </button>
    <div class="layer-picker">
      <button
        class="map-action icon-button"
        type="button"
        (click)="toggleLayerMenu()"
        [attr.aria-expanded]="isLayerMenuOpen()"
        aria-label="Map layers"
      >
        <img src="icons/LayersIcon.png" alt="" />
      </button>

      @if (isLayerMenuOpen()) {
        <div class="layer-popup" role="menu">
          <button type="button" role="menuitem" (click)="selectLayer('streets')">Streets</button>
          <button type="button" role="menuitem" (click)="selectLayer('satellite')">
            Satellite
          </button>
          <button type="button" role="menuitem" (click)="selectLayer('topographic')">
            Topographic
          </button>
        </div>
      }
    </div>
    <button
      class="map-action icon-button"
      type="button"
      (click)="toggleFullscreen()"
      aria-label="Full screen"
    >
      <img src="icons/FullScreenIcon.png" alt="" />
    </button>
  </div>
</div>
