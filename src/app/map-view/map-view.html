<div class="map-shell" #mapShell>
  <div id="map"></div>

  <div class="map-actions">
    <button type="button" (click)="zoomIn()" aria-label="Zoom in">+</button>
    <button class="zoom-percent" type="button" disabled> {{ zoomPercent() }}%</button>
    <button type="button" (click)="zoomOut()" aria-label="Zoom out">−</button>

    <button type="button" (click)="locateMe()">Use my location</button>
    <button type="button" (click)="toggleFullscreen()">Full screen</button>
  </div>
</div>
